# ABOUTME: Docker Compose configuration for n8n workflow automation.
# ABOUTME: Uses Cloudflare Tunnel (cloudflared) to expose n8n at n8n.develle.fr for the M2 course.

services:
  n8n:
    image: docker.n8n.io/n8nio/n8n:2.8.3
    restart: unless-stopped
    environment:
      - GENERIC_TIMEZONE=${GENERIC_TIMEZONE}
      - TZ=${GENERIC_TIMEZONE}
      - N8N_PORT=5678
      - N8N_PROTOCOL=http
      - N8N_HOST=${N8N_HOST}
      - WEBHOOK_URL=${WEBHOOK_URL}
      - N8N_EDITOR_BASE_URL=${N8N_EDITOR_BASE_URL}
      - N8N_SECURE_COOKIE=false
      - N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS=true
      # --- Security hardening for shared student access ---
      # Block dangerous nodes (shell exec, file I/O, SSH, git)
      - NODES_EXCLUDE=["n8n-nodes-base.executeCommand","n8n-nodes-base.readWriteFile","n8n-nodes-base.ssh","n8n-nodes-base.git","n8n-nodes-base.localFileTrigger"]
      # Block env var access from workflows
      - N8N_BLOCK_ENV_ACCESS_IN_NODE=true
      # Block access to n8n internal config files
      - N8N_BLOCK_FILE_ACCESS_TO_N8N_FILES=true
      # Restrict file access to shared dir only
      - N8N_RESTRICT_FILE_ACCESS_TO=/files
      # Disable community package installs
      - N8N_COMMUNITY_PACKAGES_ENABLED=false
      # Code node: no module imports (sandboxed math/string ops only)
      - NODE_FUNCTION_ALLOW_BUILTIN=
      - NODE_FUNCTION_ALLOW_EXTERNAL=
    volumes:
      - n8n_data:/home/node/.n8n
      - ./shared:/files

  cloudflared:
    image: cloudflare/cloudflared:latest
    restart: unless-stopped
    command: tunnel run
    environment:
      - TUNNEL_TOKEN=${CLOUDFLARE_TUNNEL_TOKEN}
    depends_on:
      - n8n

volumes:
  n8n_data:
