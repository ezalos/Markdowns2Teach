    description: "1-2 concrete project ideas students can execute in a 45-90 min session"
    detail_level: detailed
  tutorial_resources:
    description: "URLs to official tutorials, YouTube walkthroughs, Colab notebooks, documentation for beginners"
    detail_level: detailed
  student_prerequisites:
    description: "What students need to know: nothing | basic prompting | basic Python | intermediate Python | ML basics"
    detail_level: brief
  session_mapping:
    description: "Which course session(s) this supports (1-5) and how"
    detail_level: brief

confidence:
  data_quality:
    description: "High / Medium / Low — based on source reputation and recency"
    detail_level: brief
  cross_reference:
    description: "Other sources confirming the information"
    detail_level: moderate
  caveats:
    description: "Known limitations, rapidly evolving features, or contested claims"
    detail_level: moderate

uncertain: []
