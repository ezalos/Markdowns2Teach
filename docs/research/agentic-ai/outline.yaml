# ABOUTME: Research outline for Agentic AI 2024-2026.
# ABOUTME: Frameworks, protocols, patterns, products, and market data for entrepreneurial decision-making.

topic: "Agentic AI 2024-2026"
description: >
  Comprehensive mapping of the agentic AI landscape — frameworks, protocols, architectural
  patterns, products, market data, and emerging standards. Emphasis on build-vs-buy decisions
  for AI entrepreneurs, with practical deployment considerations.
time_range: "since 2024"
session: 4

items:
  # Frameworks & Platforms
  - name: "LangChain / LangGraph"
    category: "framework"
    notes: "Most popular open-source framework for agentic workflows, graph-based orchestration"
  - name: "CrewAI"
    category: "framework"
    notes: "Multi-agent orchestration framework, role-based agent design"
  - name: "AutoGen (Microsoft)"
    category: "framework"
    notes: "Multi-agent conversation framework, GroupChat patterns, merging into Microsoft Agent Framework"
  - name: "OpenAI Agents SDK"
    category: "framework"
    notes: "OpenAI's official agent-building toolkit (released Mar 2025), successor to Swarm"
  - name: "Anthropic Claude Code / Agent SDK"
    category: "framework"
    notes: "Anthropic's CLI agent and SDK for building autonomous coding agents"
  - name: "Google Vertex AI Agent Builder"
    category: "platform"
    notes: "Enterprise agent platform with grounding, tool use, and orchestration"
  - name: "Amazon Bedrock Agents"
    category: "platform"
    notes: "AWS managed agent service with action groups and knowledge bases"
  - name: "Hugging Face smolagents"
    category: "framework"
    notes: "Lightweight open-source agent framework, code-first approach"
  - name: "Google Agent Development Kit (ADK)"
    category: "framework"
    notes: "Google's open-source code-first agent framework, released Dec 2025, MCP support, model-agnostic"
  - name: "Microsoft Agent Framework (Semantic Kernel + AutoGen)"
    category: "framework"
    notes: "Oct 2025 merger of Semantic Kernel enterprise stability + AutoGen multi-agent orchestration"
  - name: "AWS Strands Agents"
    category: "framework"
    notes: "AWS open-source agent SDK, model-first, four multi-agent patterns, Bedrock AgentCore integration"

  # Protocols & Standards
  - name: "Model Context Protocol (MCP)"
    category: "protocol"
    notes: "Anthropic's open standard for connecting AI agents to tools and data, 97M monthly SDK downloads, 10K+ servers"
  - name: "OpenAI Function Calling & Tool Use"
    category: "protocol"
    notes: "De facto standard for structured tool invocation by LLMs"
  - name: "Agent-to-Agent Protocol (A2A) & ACP"
    category: "protocol"
    notes: "Google's A2A + IBM's ACP merged under Linux Foundation Aug 2025, multi-agent interoperability"
  - name: "AGENTS.md"
    category: "standard"
    notes: "OpenAI's open standard for project-specific agent guidance, 60K+ projects, contributed to AAIF Dec 2025"
  - name: "Agentic AI Foundation (AAIF)"
    category: "standard"
    notes: "Linux Foundation initiative (Dec 2025), governs MCP, goose, AGENTS.md; AWS, Anthropic, Google, Microsoft, OpenAI as platinum members"

  # Agent Patterns & Architectures
  - name: "ReAct Pattern (Reasoning + Acting)"
    category: "pattern"
    notes: "Foundational agent loop: think → act → observe → repeat"
  - name: "Tool Use & Function Calling"
    category: "pattern"
    notes: "Core capability enabling agents to interact with external systems"
  - name: "Multi-Agent Systems (MAS)"
    category: "pattern"
    notes: "Architectures where multiple specialized agents collaborate: manager, sequential, swarm, group chat"
  - name: "Agentic RAG"
    category: "pattern"
    notes: "Agents that autonomously decide when/how to retrieve information"
  - name: "Code Generation Agents"
    category: "pattern"
    notes: "Agents that write, test, and debug code autonomously (Devin, Codex, Claude Code)"
  - name: "Planning & Reasoning Agents"
    category: "pattern"
    notes: "Chain-of-thought, tree-of-thought, and planning-based architectures"
  - name: "Context Engineering"
    category: "pattern"
    notes: "Emerging discipline treating context as first-class system, successor to prompt engineering for agents"

  # Products & Applications
  - name: "Devin (Cognition Labs)"
    category: "product"
    notes: "First 'AI software engineer', autonomous coding agent"
  - name: "OpenAI Codex (CLI agent)"
    category: "product"
    notes: "OpenAI's terminal-based coding agent (released May 2025)"
  - name: "Google Jules"
    category: "product"
    notes: "Google's autonomous coding agent, Gemini 3 Pro, exited beta Aug 2025, clones repos to Cloud VMs"
  - name: "Operator / Computer Use / Agentic Browsers"
    category: "product"
    notes: "GUI-interacting agents: OpenAI Operator, Anthropic Computer Use, Google Mariner, ChatGPT Atlas, Perplexity Comet, Dia"
  - name: "Salesforce Agentforce"
    category: "product"
    notes: "Enterprise agentic AI platform for CRM workflows"
  - name: "ServiceNow AI Agents"
    category: "product"
    notes: "Enterprise IT service management agents"
  - name: "Replit Agent"
    category: "product"
    notes: "Code generation agent integrated into Replit IDE"
  - name: "Manus AI"
    category: "product"
    notes: "Chinese general-purpose agent (Mar 2025), broke GAIA benchmark, Meta acquisition Dec 2025 ($2-3B)"
  - name: "Deep Research Agents (OpenAI / Google)"
    category: "product"
    notes: "Long-running autonomous research agents, iterative planning and knowledge gap identification"
  - name: "No-Code Agent Builders (Lindy, Relevance AI, n8n)"
    category: "product"
    notes: "Visual agent builders for non-technical teams, SOC 2/HIPAA compliance, enterprise focus"
  - name: "Voice AI Agent Platforms (Vapi, Bland, ElevenLabs, Retell)"
    category: "product"
    notes: "Voice agent market $2.4B (2024) → $47.5B by 2034 (34.8% CAGR), real-time webhooks and CRM integration"

  # Market & Ecosystem
  - name: "Agentic AI Market Size & Growth"
    category: "market_data"
    notes: "$6.96-7.55B in 2025, 40-42% CAGR, projected $139-199B by 2034"
  - name: "Enterprise Agentic AI Adoption"
    category: "market_data"
    notes: "Gartner: 40% enterprise apps with agents by 2026; 40% agentic projects cancelled by 2027"
  - name: "Agent Safety & Alignment"
    category: "market_data"
    notes: "90% agents over-permissioned, hallucination cascading, permission creep, unintended actions"
  - name: "Agent Evaluation & Benchmarks"
    category: "market_data"
    notes: "SWE-bench, GAIA, AgentBench, WebArena, and emerging eval frameworks"
  - name: "Agent Observability & Monitoring"
    category: "market_data"
    notes: "LangSmith, Langfuse (open-source), AgentOps, Laminar — DevOps for agents"
  - name: "Vibe Coding"
    category: "market_data"
    notes: "Karpathy-coined term (early 2025), building apps via natural language, shifts definition of developer"

execution:
  batch_size: 3
  items_per_agent: 1
  output_dir: "./results"
