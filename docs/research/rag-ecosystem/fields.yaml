# ABOUTME: Field definitions for RAG Ecosystem & Implementation Tools research.
# ABOUTME: Covers technical architecture, RAG capabilities, performance, integration, pricing, adoption, and entrepreneurial relevance.

basic_information:
  name:
    description: "Official name of the tool, model, pattern, or concept"
    detail_level: brief
  type:
    description: "Category: vector_database | embedding_model | rag_framework | advanced_pattern | rag_service | document_processing | evaluation | market_trends"
    detail_level: brief
  creator:
    description: "Company or organization that created/maintains this"
    detail_level: brief
  description:
    description: "One-paragraph summary of what this item does and why it matters"
    detail_level: moderate
  release_date:
    description: "Initial release or latest major version date"
    detail_level: brief
  license:
    description: "License type: Apache 2.0, MIT, proprietary, open-core, etc."
    detail_level: brief
  github_stars:
    description: "GitHub stars count if open-source (approximate, with date)"
    detail_level: brief

technical_architecture:
  architecture_type:
    description: "Core architecture: in-memory, disk-based, serverless, distributed, library, API, hybrid"
    detail_level: moderate
  language:
    description: "Implementation language(s): Rust, Go, Python, C++, Java, etc."
    detail_level: brief
  embedding_dimensions:
    description: "Supported embedding dimensions or model output dimensions"
    detail_level: brief
  indexing_algorithm:
    description: "Vector indexing method: HNSW, IVF, DiskANN, flat, product quantization, binary quantization"
    detail_level: moderate
  scalability:
    description: "Max vector count, horizontal scaling, sharding, multi-tenancy support"
    detail_level: moderate
  deployment_options:
    description: "Cloud-managed, self-hosted, serverless, edge, on-device, Docker, Kubernetes"
    detail_level: moderate

rag_specific_capabilities:
  retrieval_method:
    description: "Supported retrieval: dense vector, sparse (BM25/SPLADE), hybrid, multi-vector, knowledge graph"
    detail_level: moderate
  chunking_strategy_support:
    description: "Supported chunking methods: fixed-size, semantic, recursive, late chunking, document-structure-aware, RAPTOR hierarchical"
    detail_level: moderate
  reranking_support:
    description: "Built-in reranking capabilities or integrations (cross-encoder, ColBERT, score fusion)"
    detail_level: moderate
  multimodal_support:
    description: "Support for non-text data: images, tables, charts, audio, video embeddings"
    detail_level: moderate
  graph_rag_support:
    description: "Knowledge graph construction, entity extraction, and graph-enhanced retrieval capabilities"
    detail_level: moderate
  citation_grounding:
    description: "Built-in source attribution, citation generation, or grounding verification"
    detail_level: moderate
  context_window_optimization:
    description: "How the tool handles context window limits: compression, selection, summarization"
    detail_level: moderate

performance_and_benchmarks:
  latency:
    description: "Query latency (p50/p99) for typical workloads"
    detail_level: moderate
  throughput:
    description: "Queries per second, documents processed per second"
    detail_level: moderate
  accuracy_metrics:
    description: "Recall@k, NDCG, MRR, MTEB score, or RAG-specific metrics (faithfulness, relevance)"
    detail_level: moderate
  benchmark_results:
    description: "Performance on standard benchmarks (MTEB, BEIR, ANN-Benchmarks, SWE-Bench for code RAG)"
    detail_level: moderate

integration_and_ecosystem:
  framework_compatibility:
    description: "Integration with LangChain, LlamaIndex, Haystack, DSPy, and other orchestrators"
    detail_level: moderate
  model_compatibility:
    description: "Compatible LLM providers: OpenAI, Anthropic, Google, Mistral, open-source models"
    detail_level: moderate
  mcp_integration_status:
    description: "Whether the tool offers an MCP (Model Context Protocol) server for standardized agent integration"
    detail_level: brief
  data_source_connectors:
    description: "Supported data sources: S3, GCS, databases, Confluence, Notion, Slack, web crawl, APIs"
    detail_level: moderate
  observability_integration:
    description: "Compatible tracing/monitoring platforms (LangSmith, Arize Phoenix, Langfuse), OpenTelemetry support"
    detail_level: moderate

pricing_and_cost:
  pricing_model:
    description: "Pricing structure: free tier, pay-per-query, per-vector, per-GB, per-seat, per-token"
    detail_level: moderate
  free_tier:
    description: "Free tier limits and what's included"
    detail_level: brief
  cost_at_scale:
    description: "Cost estimates for 1M, 10M, 100M vectors or documents; or per-1M-token pricing"
    detail_level: moderate
  total_cost_of_ownership:
    description: "Full TCO including compute, storage, embedding costs, not just the tool itself"
    detail_level: moderate

adoption_and_market:
  market_position:
    description: "Leader, challenger, niche, or emerging; market share if available"
    detail_level: moderate
  notable_customers:
    description: "Key enterprise customers or use cases"
    detail_level: moderate
  community_size:
    description: "GitHub stars, Discord/Slack members, monthly downloads, contributors"
    detail_level: brief
  funding_and_valuation:
    description: "Total funding raised, latest round, valuation if known"
    detail_level: moderate
  competitive_landscape:
    description: "Main competitors and key differentiators"
    detail_level: moderate

entrepreneurial_relevance:
  startup_applicability:
    description: "When a startup should use this: team size, budget, use case fit"
    detail_level: detailed
  build_vs_buy_guidance:
    description: "When to self-host vs use managed service, cost/effort tradeoffs"
    detail_level: moderate
  time_to_production:
    description: "Typical time from POC to production deployment"
    detail_level: moderate
  key_lessons:
    description: "Top 3-5 actionable lessons for entrepreneurs building RAG systems"
    detail_level: detailed
  no_code_interface:
    description: "Whether the tool provides a visual/no-code builder for RAG pipelines"
    detail_level: brief
  session_mapping:
    description: "Which course session this supports (1-5)"
    detail_level: brief

confidence:
  data_quality:
    description: "High / Medium / Low — based on source reputation and recency"
    detail_level: brief
  cross_reference:
    description: "Other sources confirming the information"
    detail_level: moderate
  caveats:
    description: "Known limitations, rapidly evolving status, or contested claims"
    detail_level: moderate
  security_posture:
    description: "Known attack surfaces (knowledge base poisoning, embedding inversion), built-in mitigations, compliance"
    detail_level: moderate

uncertain: []
