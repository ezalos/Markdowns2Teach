# ABOUTME: Field definitions for AI Project Frameworks & Methodologies research (Research 5).
# ABOUTME: 23 fields across 6 categories defining what to research for each framework.

topic: "AI Project Frameworks & Methodologies 2024-2026"

field_categories:

  identity:
    description: "Basic identification and access information"
    fields:
      framework_name:
        description: "Official name of the framework or methodology"
        detail_level: brief
      creator_or_source:
        description: "Person, company, or institution that created it"
        detail_level: brief
      year_introduced:
        description: "Year first published or widely adopted"
        detail_level: brief
      primary_url:
        description: "Best URL to access the framework documentation, template, or primary source"
        detail_level: brief

  framework_profile:
    description: "What the framework covers and how it works"
    fields:
      framework_type:
        description: "Type: Canvas / Lifecycle / Maturity Model / Decision Matrix / Checklist / Playbook / Regulatory / Standard / Methodology"
        detail_level: brief
      scope:
        description: "What it covers: Full project lifecycle, Single phase, Assessment, Decision-making, Team design, Financial, Governance"
        detail_level: brief
      key_components:
        description: "Main elements, steps, phases, or sections of the framework — the actual content and structure explained"
        detail_level: detailed
      typical_use_case:
        description: "When and how to use this framework in practice. Concrete scenario"
        detail_level: moderate
      deliverables:
        description: "What the framework produces: filled canvas, score, decision, roadmap, risk register, checklist, etc."
        detail_level: brief
      genai_relevance:
        description: "Whether this framework has been updated for or is specifically applicable to Generative AI / LLM projects (not just classical ML). Rate High/Medium/Low with explanation"
        detail_level: moderate

  accessibility_and_adoption:
    description: "How approachable and widely used the framework is"
    fields:
      accessibility_for_non_engineers:
        description: "How approachable for business students with no technical background. Rate High/Medium/Low with explanation"
        detail_level: moderate
      time_to_apply:
        description: "How long it takes to use: 30 min, half-day workshop, multi-week assessment, ongoing process"
        detail_level: brief
      free_or_paid:
        description: "Access model: Free / Template available / Consulting required / Paid tool"
        detail_level: brief
      adoption_level:
        description: "How widely used: Industry standard / Widely adopted / Emerging / Niche"
        detail_level: brief
      ai_project_stage:
        description: "Which project stage(s) the framework primarily serves: Ideation, PoC, MVP, Production, Scale, Maintenance, or Multiple"
        detail_level: brief

  entrepreneurial_relevance:
    description: "Value for AI entrepreneurs and business students"
    fields:
      relevance_for_entrepreneurs:
        description: "Why a startup founder should know this framework. Specific value for business decisions"
        detail_level: moderate
      session_mapping:
        description: "Which course session(s) this resource best supports: S1 (Fundamentals), S2 (Prompts/Tools), S3 (Projects), S4 (Business Models), S5 (Ethics/Governance), or Cross-session"
        detail_level: brief
      complements:
        description: "Other frameworks in this research that pair well with this one and why"
        detail_level: moderate
      limitations:
        description: "Known weaknesses or situations where the framework doesn't apply well"
        detail_level: moderate

  practical_application:
    description: "How to actually use the framework"
    fields:
      example_application:
        description: "Concrete example of using this framework for a startup or business scenario"
        detail_level: moderate
      available_templates:
        description: "Where to find fillable templates, tools, worksheets, or Miro/Notion templates"
        detail_level: brief
      regulatory_alignment:
        description: "Which regulations the framework helps comply with: EU AI Act, GDPR, NIST AI RMF, ISO 42001, or None"
        detail_level: brief

  uncertain:
    description: "List of field names with low-confidence values (auto-filled during deep research phase)"
    fields: []
