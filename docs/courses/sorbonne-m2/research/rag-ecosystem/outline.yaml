# ABOUTME: Research outline for RAG Ecosystem & Implementation Tools 2024-2026.
# ABOUTME: Covers vector databases, embedding models, RAG frameworks, advanced patterns, platforms, evaluation, and market trends.

topic: "RAG Ecosystem & Implementation Tools 2024-2026"
description: >
  Comprehensive mapping of the RAG (Retrieval-Augmented Generation) ecosystem — vector databases,
  embedding models, orchestration frameworks, advanced retrieval patterns, RAG-as-a-Service platforms,
  document processing pipelines, evaluation tools, and market dynamics. Emphasis on build-vs-buy
  decisions for AI entrepreneurs, with practical implementation guidance.
time_range: "last 6 months"
session: 3

items:
  # Vector Databases & Search
  - name: "Pinecone"
    category: "vector_database"
    notes: "Fully managed serverless vector DB, $750M+ raised, $100M+ ARR, 30,000+ customers"
  - name: "Weaviate"
    category: "vector_database"
    notes: "Open-source vector DB (Go), hybrid search, multi-tenancy, $67.7M raised, EU-based"
  - name: "Qdrant"
    category: "vector_database"
    notes: "Rust-based open-source vector DB, binary quantization (40x speed), FastEmbed, EU-based"
  - name: "Chroma"
    category: "vector_database"
    notes: "Developer-friendly open-source embedding DB, Python-native, lightweight, 16k+ GitHub stars"
  - name: "Milvus / Zilliz"
    category: "vector_database"
    notes: "Distributed vector DB (C++/Go), 30k+ GitHub stars, Zilliz Cloud managed service, $113M raised"
  - name: "pgvector / PostgreSQL"
    category: "vector_database"
    notes: "Vector extension for PostgreSQL, HNSW indexing, zero new infra, strong for existing PG users"
  - name: "Elasticsearch Vector Search"
    category: "vector_database"
    notes: "Elastic 8.x native vector search + BM25 hybrid, ELSER sparse model, 500M+ downloads"
  - name: "MongoDB Atlas Vector Search"
    category: "vector_database"
    notes: "Native vector search in MongoDB, unified document + vector queries, $1.9B revenue"
  - name: "Turbopuffer"
    category: "vector_database"
    notes: "Object-storage-first serverless vector DB, up to 95% cost reduction vs memory-based solutions"
  - name: "LanceDB"
    category: "vector_database"
    notes: "Open-source multimodal lakehouse on Lance format, disk-based 100x cost savings, $30M Series A"
  - name: "Meilisearch"
    category: "vector_database"
    notes: "Open-source Rust-based search engine, native hybrid search (BM25 + vector), MIT-licensed"

  # Embedding Models
  - name: "OpenAI text-embedding-3"
    category: "embedding_model"
    notes: "text-embedding-3-large (3072d) and text-embedding-3-small (1536d), Matryoshka support"
  - name: "Cohere Embed v3 / v4"
    category: "embedding_model"
    notes: "Multilingual, int8/binary quantization, 1024d, 137 languages, Compass embedding"
  - name: "Voyage AI"
    category: "embedding_model"
    notes: "Domain-specialized embeddings (code, finance, legal, multilingual), acquired by Anthropic"
  - name: "Open-Source Embeddings (BGE / E5 / GTE / NV-Embed)"
    category: "embedding_model"
    notes: "BAAI BGE-M3, Microsoft E5-Mistral, Alibaba GTE-Qwen2, NVIDIA NV-Embed — MTEB leaders"
  - name: "Sentence Transformers & MTEB"
    category: "embedding_model"
    notes: "Framework for training/evaluating embeddings, MTEB benchmark standard, 15k+ GitHub stars"
  - name: "Gemini Embedding (Google)"
    category: "embedding_model"
    notes: "#1 on MTEB overall leaderboard, 100+ languages, $0.15/M tokens, state-of-the-art"
  - name: "Qwen3-Embedding (Alibaba)"
    category: "embedding_model"
    notes: "#1 on MTEB Multilingual leaderboard, Apache 2.0, 0.6B/4B/8B sizes"
  - name: "Jina Embeddings v3 / Reranker v3"
    category: "embedding_model"
    notes: "Multilingual embeddings + reranking, late chunking support, ColBERT-style models"

  # RAG Frameworks & Orchestration
  - name: "LangChain RAG"
    category: "rag_framework"
    notes: "Most popular LLM framework, LCEL chains, 100+ integrations, LangSmith observability"
  - name: "LlamaIndex"
    category: "rag_framework"
    notes: "Data framework for LLM apps, index abstractions, query engines, LlamaCloud managed"
  - name: "Haystack (deepset)"
    category: "rag_framework"
    notes: "Open-source Python framework, pipeline-based, 18k+ GitHub stars, EU-based"
  - name: "RAGFlow"
    category: "rag_framework"
    notes: "Open-source RAG engine, deep document understanding, template-based chunking"
  - name: "R2R (SciPhi)"
    category: "rag_framework"
    notes: "Production-ready agentic RAG, built-in hybrid search, GraphRAG, knowledge graphs"
  - name: "DSPy (Stanford NLP)"
    category: "rag_framework"
    notes: "Programming (not prompting) LMs, automated prompt/weight optimization, MIPROv2"
  - name: "Dify"
    category: "rag_framework"
    notes: "Open-source AI app platform, visual workflows, agent framework, built-in RAG knowledge base"

  # Advanced RAG Patterns
  - name: "RAG Taxonomy (Naive / Advanced / Modular)"
    category: "advanced_pattern"
    notes: "Classification framework: Naive RAG → Advanced RAG → Modular RAG evolution"
  - name: "Hybrid Search (Dense + Sparse)"
    category: "advanced_pattern"
    notes: "Combining vector search with BM25/SPLADE for better recall, RRF fusion"
  - name: "Reranking Strategies"
    category: "advanced_pattern"
    notes: "Cross-encoder reranking (Cohere, Jina, BGE), ColBERT late interaction, score calibration"
  - name: "Chunking Strategies"
    category: "advanced_pattern"
    notes: "Fixed-size, semantic, recursive, document-structure-aware, parent-child, sliding window"
  - name: "Query Transformation & Routing"
    category: "advanced_pattern"
    notes: "HyDE, multi-query, step-back prompting, query decomposition, semantic routing"
  - name: "Agentic RAG"
    category: "advanced_pattern"
    notes: "LLM as reasoning agent deciding when/how to retrieve, multi-step retrieval, tool selection"
  - name: "Graph RAG (Microsoft)"
    category: "advanced_pattern"
    notes: "Knowledge graph + community summaries for global queries, open-source, 30k+ stars"
  - name: "Self-RAG / Corrective RAG (CRAG)"
    category: "advanced_pattern"
    notes: "Self-reflection on retrieval relevance, adaptive retrieval with critic tokens"
  - name: "LightRAG (HKUDS)"
    category: "advanced_pattern"
    notes: "EMNLP 2025, lightweight GraphRAG alternative, entity/relation vector retrieval, cheaper/faster"
  - name: "RAPTOR (Recursive Abstractive Processing)"
    category: "advanced_pattern"
    notes: "Hierarchical tree of document summaries via recursive clustering, 20% accuracy improvement on multi-hop QA"
  - name: "Cache-Augmented Generation (CAG)"
    category: "advanced_pattern"
    notes: "Preloads knowledge into LLM context + KV cache, 40x faster than RAG on small corpora, ACM Web 2025"
  - name: "Late Chunking (Jina AI)"
    category: "advanced_pattern"
    notes: "Embeds entire document first, then chunks embeddings to preserve cross-chunk context, 49% fewer failures"
  - name: "ColPali / Vision RAG"
    category: "advanced_pattern"
    notes: "Treats PDF pages as images using ColBERT-style late interaction, eliminates OCR pipeline"
  - name: "Multimodal RAG"
    category: "advanced_pattern"
    notes: "Retrieving images, tables, charts alongside text; CLIP embeddings, vision encoders"

  # RAG-as-a-Service & Managed Platforms
  - name: "Vectara"
    category: "rag_service"
    notes: "End-to-end RAG platform, neural search API, grounded generation, hallucination detection"
  - name: "Cohere RAG (Command R/R+)"
    category: "rag_service"
    notes: "Models with built-in RAG + citations, Coral enterprise RAG, multi-step search"
  - name: "Perplexity API / Sonar"
    category: "rag_service"
    notes: "Real-time web RAG API, citations included, Sonar models, answer engine"
  - name: "Google Vertex AI RAG Engine"
    category: "rag_service"
    notes: "Managed RAG on GCP, Gemini integration, grounding with Google Search, Vertex AI Search"
  - name: "Amazon Bedrock Knowledge Bases"
    category: "rag_service"
    notes: "Managed RAG on AWS, OpenSearch/Aurora vector stores, S3 data sources, automatic chunking"
  - name: "Azure AI Search + OpenAI"
    category: "rag_service"
    notes: "Microsoft's RAG stack, semantic ranking, integrated chunking, On Your Data API"
  - name: "OpenAI File Search / Web Search (Responses API)"
    category: "rag_service"
    notes: "Built-in RAG via Vector Store API with automatic parsing/chunking/embedding, web search tool"
  - name: "Anthropic Contextual Retrieval"
    category: "rag_service"
    notes: "Prepends chunk-specific context before embedding, 49% fewer failed retrievals, 67% with reranking"

  # Document Processing & Ingestion
  - name: "Unstructured.io"
    category: "document_processing"
    notes: "Open-source data ingestion, 25+ file types, partitioning/chunking, enterprise platform"
  - name: "LlamaParse"
    category: "document_processing"
    notes: "LlamaIndex's document parser, multimodal parsing, tables/images, API-based"
  - name: "Docling (IBM)"
    category: "document_processing"
    notes: "Open-source document conversion, PDF/DOCX/PPTX/HTML, Granite-Docling models, MIT-licensed"
  - name: "MinerU (OpenDataLab)"
    category: "document_processing"
    notes: "Open-source PDF extraction, 84 OCR languages, LaTeX formulas, HTML tables"
  - name: "Crawl4AI / Firecrawl"
    category: "document_processing"
    notes: "Web crawling for RAG ingestion, Crawl4AI open-source 58k+ stars, Firecrawl API-first enterprise"

  # Evaluation, Observability & Security
  - name: "RAGAS"
    category: "evaluation"
    notes: "RAG evaluation framework, faithfulness/relevance/recall metrics, 7k+ GitHub stars"
  - name: "DeepEval"
    category: "evaluation"
    notes: "Python-first LLM evaluation, 14+ metrics, CI/CD integration, component-level RAG debugging"
  - name: "RAG Observability (LangSmith / Arize Phoenix)"
    category: "evaluation"
    notes: "Production tracing and debugging, LangSmith for LangChain, Phoenix is OpenTelemetry-native"
  - name: "RAG Security & Adversarial Robustness"
    category: "evaluation"
    notes: "Knowledge base poisoning, embedding inversion, indirect prompt injection, NeMo Guardrails"
  - name: "Hallucination Detection & Grounding"
    category: "evaluation"
    notes: "Vectara HHEM, Galileo, Lynx, TruLens, automatic citation verification techniques"

  # Market & Trends
  - name: "RAG Market Size & Growth"
    category: "market_trends"
    notes: "Market $1.4-2.1B in 2024, projected $9.9-30.1B by 2030, 30-45% CAGR"
  - name: "RAG vs Fine-tuning Decision Framework"
    category: "market_trends"
    notes: "When to use RAG vs fine-tuning vs both, cost/accuracy tradeoffs, enterprise patterns"
  - name: "Long Context vs RAG Debate"
    category: "market_trends"
    notes: "2M+ token windows vs retrieval, CAG hybrid approaches, when RAG still wins"

execution:
  batch_size: 3
  items_per_agent: 1
  output_dir: "./results"
