# ABOUTME: Research outline for AI Business Models & Strategy 2024-2026.
# ABOUTME: Covers business model patterns, pricing, unit economics, investment dynamics, case studies, and emerging models.

topic: "AI Business Models & Strategy 2024-2026"
description: >
  Comprehensive mapping of AI business models — revenue patterns, pricing strategies,
  unit economics, investment dynamics, competitive moats, and case studies. Emphasis on
  entrepreneurial decision-making for AI-native startups and AI adoption in traditional businesses.
time_range: "last 6 months"
session: 4

items:
  # Business Model Patterns & Frameworks
  - name: "AI-as-a-Service (AIaaS) Models"
    category: "pattern"
    notes: "API-based, pay-per-use AI delivery (OpenAI API, Anthropic API, Replicate)"
  - name: "Foundation Model Economics"
    category: "pattern"
    notes: "Cost structures, pricing strategies, and unit economics of training/serving LLMs"
  - name: "Open-Source AI Business Models"
    category: "pattern"
    notes: "How companies monetize open-source AI (Meta Llama, Mistral, Hugging Face)"
  - name: "AI Wrapper / Application Layer"
    category: "pattern"
    notes: "Startups building on top of foundation model APIs (Jasper, Copy.ai, Perplexity)"
  - name: "Vertical AI SaaS"
    category: "pattern"
    notes: "Domain-specific AI products (Harvey for legal, Abridge for healthcare, EvenUp for insurance)"
  - name: "AI Infrastructure & Picks-and-Shovels"
    category: "pattern"
    notes: "GPU cloud, MLOps, data labeling (CoreWeave, Scale AI, Weights & Biases)"
  - name: "AI Marketplace & Platform Models"
    category: "pattern"
    notes: "Platforms connecting AI supply/demand (Hugging Face Hub, Replicate, Together AI)"
  - name: "Freemium & Prosumer AI"
    category: "pattern"
    notes: "Consumer AI products with free/paid tiers (ChatGPT, Claude, Midjourney, Perplexity)"
  - name: "AI Agents as Products"
    category: "pattern"
    notes: "Pricing models for autonomous agents (Devin per-ACU, Salesforce per-conversation)"
  - name: "Data Moats & Flywheel Effects"
    category: "pattern"
    notes: "How data advantages compound in AI businesses"
  - name: "Digital Labor / AI-as-Workforce Pricing"
    category: "pattern"
    notes: "AI employees budgeted as labor cost, per-FTE-replaced pricing, Agentforce ~$540M ARR"
  - name: "AI Content & Data Licensing Models"
    category: "pattern"
    notes: "Content owners licensing training data — Reddit $130M/yr, News Corp $250M+, Shutterstock $100M+"
  - name: "Generative Media Business Models"
    category: "pattern"
    notes: "Video/image/audio AI products — Kling AI $240M ARR, Runway, Sora, credit-based pricing"
  - name: "Synthetic Data as a Service"
    category: "pattern"
    notes: "Market $6.7-8.2B by 2029, NVIDIA acquired Gretel Labs $320M, 75% businesses by 2026"

  # Revenue & Pricing Strategies
  - name: "Token-Based Pricing"
    category: "pricing"
    notes: "Per-token/per-call API pricing models and their economics"
  - name: "Seat-Based vs. Outcome-Based Pricing"
    category: "pricing"
    notes: "The shift from per-user to per-result pricing in AI products"
  - name: "AI Revenue Benchmarks 2024-2026"
    category: "market_data"
    notes: "ARR growth rates, margins, and multiples for AI companies"

  # Scaling & Unit Economics
  - name: "GPU Economics & Compute Costs"
    category: "market_data"
    notes: "Cost of training vs inference, GPU scarcity/surplus dynamics, inference flip"
  - name: "AI Startup Unit Economics"
    category: "market_data"
    notes: "CAC, LTV, gross margins, burn rates for AI-native companies"
  - name: "Scaling Laws & Business Implications"
    category: "market_data"
    notes: "How scaling laws affect build vs buy and competitive dynamics"
  - name: "DeepSeek & the Cost Disruption Paradigm"
    category: "market_data"
    notes: "DeepSeek-R1 trained for $6M, 99% price drop in 2 years, commoditization accelerator"
  - name: "AI Model Distillation & Commoditization"
    category: "market_data"
    notes: "Small models from frontier outputs at $50, market bifurcating commodity vs specialist"
  - name: "AI Inference-as-a-Service & Custom Silicon"
    category: "market_data"
    notes: "Inference flip, NVIDIA acquired Groq $20B, custom ASICs growing 44.6% in 2026"
  - name: "AI Energy & Power Infrastructure Economics"
    category: "market_data"
    notes: "AI data centers >1000 TWh by 2026, Microsoft TMI restart, Oracle SMR data center"

  # Investment & Market Dynamics
  - name: "AI Venture Capital Landscape 2024-2026"
    category: "market_data"
    notes: "Funding trends, AI captured 52.7% of all global VC ($270B) in 2025"
  - name: "AI Company Valuations & Multiples"
    category: "market_data"
    notes: "Revenue multiples, growth-adjusted metrics for AI companies"
  - name: "AI M&A Activity 2024-2026"
    category: "market_data"
    notes: "Major acquisitions (Character.AI, Windsurf, Manus, Wiz, Groq, SambaNova)"
  - name: "Sovereign AI as Business Driver"
    category: "market_data"
    notes: "Saudi $1T pledge, UAE 26 sq km AI campus, France Mistral Compute, captive markets"

  # Strategic Frameworks
  - name: "Build vs Buy vs Fine-tune"
    category: "framework"
    notes: "Decision framework for AI implementation in startups"
  - name: "AI Moats & Competitive Advantages"
    category: "framework"
    notes: "What creates defensibility in AI businesses"
  - name: "AI Go-to-Market Strategies"
    category: "framework"
    notes: "PLG, enterprise sales, developer-first, community-led growth in AI"
  - name: "AI Business Canvas / Lean AI"
    category: "framework"
    notes: "Adapted business model frameworks for AI ventures"

  # Case Studies
  - name: "OpenAI Business Model Evolution"
    category: "case_study"
    notes: "From nonprofit to $730B valuation, $20B+ ARR, for-profit conversion, $100B funding round"
  - name: "Mistral AI — European AI Champion"
    category: "case_study"
    notes: "€1B revenue target 2026, $14B valuation, open-source strategy, Mistral Compute"
  - name: "Perplexity — AI Search Disruption"
    category: "case_study"
    notes: "Answer engine model, monetization, publisher tensions"
  - name: "Klarna — AI-First Enterprise Transformation"
    category: "case_study"
    notes: "Headcount reduction, AI customer service, efficiency gains"
  - name: "Cursor / Anysphere — Fastest-Growing SaaS"
    category: "case_study"
    notes: "$29.3B valuation, $200M+ revenue, developer tool economics"
  - name: "AI Unicorn Landscape 2024-2026"
    category: "market_data"
    notes: "Overview of AI companies >$1B valuation, common patterns"

  # Emerging Models
  - name: "AI-Native Services Firms"
    category: "pattern"
    notes: "Consulting/agency models built on AI (AI employees replacing headcount)"
  - name: "Embedded AI / AI Features in Existing Products"
    category: "pattern"
    notes: "How non-AI companies add AI for pricing power"
  - name: "AI Regulation as Business Constraint"
    category: "market_data"
    notes: "How EU AI Act, compliance costs affect business models"
  - name: "AI Coding Tools Market"
    category: "market_data"
    notes: "Surpassed $3.1B revenue, projected $26B by 2030, three-tier market structure"

execution:
  batch_size: 3
  items_per_agent: 1
  output_dir: "./results"
