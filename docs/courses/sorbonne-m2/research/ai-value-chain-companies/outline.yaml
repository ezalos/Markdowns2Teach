# ABOUTME: Research outline for AI Value Chain Companies 2024-2026.
# ABOUTME: Maps ~50 companies across 9 layers from semiconductors to applications.

topic: "AI Value Chain Companies 2024-2026"
description: >
  Complete ecosystem map of the AI value chain — who does what, where value is
  created, and what matters for entrepreneurs. Covers hardware through applications,
  with emphasis on European players and startup relevance.
time_range: "since 2024"
session: 1

items:
  # Layer 0 — Energy & Power Infrastructure
  - name: "Crusoe Energy"
    layer: "energy_infrastructure"
    notes: "AI data center company using stranded natural gas, NVIDIA-backed"
  - name: "Commonwealth Fusion Systems"
    layer: "energy_infrastructure"
    notes: "Targeting first plasma 2026, Google/Microsoft partners, long-term play"

  # Layer 1 — Semiconductor / Hardware
  - name: "ASML"
    layer: "hardware"
    notes: "Only maker of EUV lithography machines, critical bottleneck"
  - name: "TSMC"
    layer: "hardware"
    notes: "Fabricates ~90% of advanced AI chips"
  - name: "NVIDIA"
    layer: "hardware"
    notes: "Dominant GPU maker (H100, B200, GB200), CUDA lock-in, acquired Groq assets"
  - name: "AMD"
    layer: "hardware"
    notes: "MI300X challenger GPUs, acquired Xilinx"
  - name: "Intel"
    layer: "hardware"
    notes: "Gaudi accelerators, foundry ambitions"
  - name: "Broadcom"
    layer: "hardware"
    notes: "Custom AI chip (ASIC) designer for hyperscalers, OpenAI chip partner"
  - name: "Cerebras Systems"
    layer: "hardware"
    notes: "Wafer-scale chips (WSE-3), OpenAI 750MW deal"
  - name: "Samsung / SK Hynix"
    layer: "hardware"
    notes: "HBM (High Bandwidth Memory) manufacturers, critical bottleneck component"

  # Layer 2 — Cloud Infrastructure / Compute
  - name: "AWS (Amazon)"
    layer: "cloud"
    notes: "Largest cloud, Trainium/Inferentia chips, Bedrock"
  - name: "Google Cloud (GCP)"
    layer: "cloud"
    notes: "TPUs, Vertex AI, DeepMind integration"
  - name: "Microsoft Azure"
    layer: "cloud"
    notes: "OpenAI exclusive partnership, Azure AI Studio"
  - name: "CoreWeave"
    layer: "cloud"
    notes: "GPU-specialized cloud, IPO March 2025, NVIDIA $2B investment Jan 2026"
  - name: "RunPod"
    layer: "cloud"
    notes: "On-demand GPU cloud for startups, pay-per-second"
  - name: "Lambda Labs"
    layer: "cloud"
    notes: "GPU cloud + workstations for AI training"
  - name: "xAI / Colossus"
    layer: "cloud"
    notes: "$230B valuation, 1M+ GPU Colossus supercomputer, vertical integration"
  - name: "OVHcloud"
    layer: "cloud"
    notes: "European sovereign cloud, EU AI Act compliance, data sovereignty"
  - name: "Scaleway (Iliad Group)"
    layer: "cloud"
    notes: "French cloud provider, AI GPU infrastructure, hosts Mistral workloads"

  # Layer 2.5 — Data Infrastructure & Labeling
  - name: "Scale AI"
    layer: "data_infrastructure"
    notes: "$29B valuation, RLHF training data for OpenAI/Anthropic, Meta 49% stake"
  - name: "Databricks"
    layer: "data_infrastructure"
    notes: "Lakehouse platform, acquired Tecton + Neon, revenue ~$3B+"
  - name: "Snowflake"
    layer: "data_infrastructure"
    notes: "Data cloud + AI capabilities (Cortex), acquired Crunchy Data"

  # Layer 3 — Foundation Model Creators
  - name: "OpenAI"
    layer: "model_creator"
    notes: "GPT-4o, o1/o3 reasoning models, ChatGPT, $157B+ valuation"
  - name: "Anthropic"
    layer: "model_creator"
    notes: "Claude 3.5/4 family, safety-focused, Constitutional AI"
  - name: "Google DeepMind"
    layer: "model_creator"
    notes: "Gemini family, AlphaFold, fundamental research"
  - name: "Meta AI"
    layer: "model_creator"
    notes: "Llama open-weight models, largest open-source contributor"
  - name: "Mistral AI"
    layer: "model_creator"
    notes: "French champion, open-weight strategy, Mistral Large/Medium/Small"
  - name: "Alibaba / Qwen"
    layer: "model_creator"
    notes: "Qwen 2.5 series, strong multilingual, Chinese AI leader"
  - name: "DeepSeek"
    layer: "model_creator"
    notes: "DeepSeek-R1/V3, breakthrough cost efficiency, Chinese lab"
  - name: "xAI (Grok)"
    layer: "model_creator"
    notes: "Grok 4/4.1 (2M context), $230B valuation, burning ~$1B/month"
  - name: "Cohere"
    layer: "model_creator"
    notes: "Enterprise-focused, Command A, on-prem deployment, NVIDIA-backed"
  - name: "Poolside AI"
    layer: "model_creator"
    notes: "French/US AI coding models, $626M raised, NVIDIA + Bpifrance backed"

  # Layer 4 — Model Hubs & Communities
  - name: "Hugging Face"
    layer: "model_hub"
    notes: "1M+ models, Transformers library, Spaces"
  - name: "CivitAI"
    layer: "model_hub"
    notes: "Community hub for image generation models"
  - name: "Ollama"
    layer: "model_hub"
    notes: "Local model runner, simplifies on-device LLM deployment"
  - name: "Replicate"
    layer: "model_hub"
    notes: "Cloud API for running open-source models, one-line deployment"

  # Layer 5 — API Providers / Routers / Orchestration
  - name: "OpenRouter"
    layer: "api_provider"
    notes: "Multi-model API router, unified access to 100+ models"
  - name: "AWS Bedrock"
    layer: "api_provider"
    notes: "Managed multi-model API (Claude, Llama, Mistral on AWS)"
  - name: "Together AI"
    layer: "api_provider"
    notes: "200+ open-source models, sub-100ms latency, up to 11x cheaper"
  - name: "Fireworks AI"
    layer: "api_provider"
    notes: "$130M ARR, $4B valuation, RL fine-tuning + LoRA hosting"
  - name: "LangChain / LangSmith"
    layer: "orchestration"
    notes: "De facto LLM orchestration framework, LangGraph for agents"
  - name: "Pinecone"
    layer: "vector_db"
    notes: "Leading managed vector database for RAG, serverless"
  - name: "Weaviate"
    layer: "vector_db"
    notes: "Open-source vector DB, strongest hybrid search"

  # Layer 6 — Evaluation, Safety & Benchmarking
  - name: "Artificial Analysis"
    layer: "evaluation"
    notes: "Independent LLM benchmarking, price/performance tracking"
  - name: "LMSYS Chatbot Arena"
    layer: "evaluation"
    notes: "Community-driven Elo ratings via blind human preference testing"
  - name: "Giskard"
    layer: "safety"
    notes: "French AI safety, continuous red-teaming, EU AI Act compliance"
  - name: "Weights & Biases"
    layer: "mlops"
    notes: "Experiment tracking, ~$100M+ ARR, CoreWeave integration, IPO candidate"

  # Layer 7 — AI-Native Applications
  - name: "Cursor"
    layer: "application"
    subcategory: "developer_tools"
    notes: "AI-first code editor, built on multiple LLM providers"
  - name: "GitHub Copilot"
    layer: "application"
    subcategory: "developer_tools"
    notes: "20M+ users, 90% of Fortune 100, $10-39/user/month"
  - name: "Perplexity AI"
    layer: "application"
    subcategory: "search"
    notes: "AI-native search, $18B valuation, genuine Google challenger"
  - name: "Harvey"
    layer: "application"
    subcategory: "vertical_ai"
    notes: "AI for legal, $8B valuation, $190M ARR, poster child for vertical AI"
  - name: "ElevenLabs"
    layer: "application"
    subcategory: "multimodal"
    notes: "AI voice synthesis leader, European (UK/Poland)"

execution:
  batch_size: 3
  items_per_agent: 2
  output_dir: "./results"
