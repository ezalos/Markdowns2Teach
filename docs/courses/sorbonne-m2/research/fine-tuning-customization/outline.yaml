# ABOUTME: Research outline for Fine-tuning & Model Customization 2024-2026.
# ABOUTME: Covers fine-tuning methods, alignment techniques, platforms, data/eval tools, and business strategy.

topic: "Fine-tuning & Model Customization 2024-2026"
description: >
  Comprehensive mapping of fine-tuning methods, alignment techniques, managed platforms,
  open-source tools, data preparation, evaluation frameworks, and business strategy for
  model customization. Emphasis on practical decision-making for entrepreneurs: when to
  fine-tune vs RAG, cost economics, platform comparison, and safety considerations.
time_range: "last 6 months"
session: 3

items:
  # Fine-tuning Methods & Techniques
  - name: "Full Fine-tuning (FFT)"
    category: "method"
    notes: "Traditional approach retraining all model parameters, high cost but maximum customization, baseline for comparison"
  - name: "LoRA (Low-Rank Adaptation)"
    category: "method"
    notes: "Parameter-efficient fine-tuning via low-rank matrices, dominant PEFT technique 2024-2026, 10-100x cheaper than FFT"
  - name: "QLoRA"
    category: "method"
    notes: "Quantized LoRA — fine-tune 4-bit models on consumer GPUs (single 24GB), democratized fine-tuning for startups"
  - name: "PEFT (Parameter-Efficient Fine-tuning)"
    category: "method"
    notes: "HuggingFace library umbrella for LoRA, prefix tuning, adapters, prompt tuning — the standard PEFT toolkit"
  - name: "Prompt Tuning / Soft Prompts"
    category: "method"
    notes: "Learned continuous prompt embeddings prepended to input, lightest-weight customization, no model weight changes"
  - name: "DPO (Direct Preference Optimization)"
    category: "alignment"
    notes: "Dominant alignment technique replacing RLHF, simpler pipeline, no reward model needed, widely adopted 2024-2026"
  - name: "RLHF (Reinforcement Learning from Human Feedback)"
    category: "alignment"
    notes: "Classic alignment method by OpenAI/Anthropic, requires reward model + PPO, expensive but powerful"
  - name: "GRPO (Group Relative Policy Optimization)"
    category: "alignment"
    notes: "DeepSeek's efficient alternative to PPO, no reward model, group-based advantage estimation, used for reasoning models"
  - name: "Distillation"
    category: "method"
    notes: "Training smaller models from larger model outputs, key cost-reduction strategy, DeepSeek-R1 distilled models as example"
  - name: "Synthetic Data for Fine-tuning"
    category: "method"
    notes: "Using LLM-generated data to train/fine-tune models, emerging best practice, reduces data collection costs 10-100x"
  - name: "Continued Pre-training / Domain-Adaptive Pre-training"
    category: "method"
    notes: "Extending base model knowledge with domain corpus before task-specific fine-tuning, critical for specialized domains"
  - name: "Mixture of Experts (MoE) Fine-tuning"
    category: "method"
    notes: "Fine-tuning MoE architectures (Mixtral, DeepSeek, gpt-oss), sparse expert activation, cost-efficient scaling"
  - name: "Model Merging (MergeKit)"
    category: "method"
    notes: "Combining multiple fine-tuned models without additional training (TIES, DARE, SLERP), practical no-compute technique"
  - name: "OpenAI Reinforcement Fine-Tuning (RFT)"
    category: "method"
    notes: "OpenAI's new paradigm using programmable graders instead of fixed answers, billed by compute time, 12-39% accuracy gains"

  # Fine-tuning Platforms & Services
  - name: "OpenAI Fine-tuning API"
    category: "platform"
    notes: "GPT-4o, GPT-4o-mini, o4-mini fine-tuning, managed service, DPO support, RFT for o4-mini, simplest onramp"
  - name: "Google Vertex AI Fine-tuning"
    category: "platform"
    notes: "Gemini fine-tuning (supervised + RLHF), integrated with Google Cloud, TPU-based, enterprise-grade"
  - name: "Amazon Bedrock Custom Models"
    category: "platform"
    notes: "Fine-tune Claude, Llama, Titan on AWS, managed service, integrated with SageMaker for advanced workflows"
  - name: "Mistral Fine-tuning (La Plateforme)"
    category: "platform"
    notes: "Fine-tune Mistral models, European sovereignty, competitive pricing, GDPR-native, essential for Sorbonne context"
  - name: "Together AI Fine-tuning"
    category: "platform"
    notes: "Fine-tune open-source models (Llama, Mistral, DeepSeek), competitive pricing, simple API, multi-LoRA serving"
  - name: "Hugging Face AutoTrain"
    category: "platform"
    notes: "No-code fine-tuning, drag-and-drop UI, supports 100+ model architectures, free tier on HF Spaces"
  - name: "LLaMA-Factory"
    category: "tool"
    notes: "Most-starred fine-tuning framework (73k+ GitHub stars), web UI (LlamaBoard), 100+ models, YAML-config-driven"
  - name: "Axolotl"
    category: "tool"
    notes: "Open-source fine-tuning framework, YAML-config-driven, supports LoRA/QLoRA/DPO/RLHF, popular in community"
  - name: "Unsloth"
    category: "tool"
    notes: "2x faster fine-tuning with 80% less memory, open-source, optimized Triton kernels, Colab-friendly, startup favorite"

  # Data & Evaluation
  - name: "Argilla"
    category: "data_eval"
    notes: "Open-source data labeling and curation for fine-tuning, RLHF annotation workflows, HuggingFace ecosystem"
  - name: "LabelStudio + LLM Integration"
    category: "data_eval"
    notes: "Data labeling platform with AI-assisted annotation, pre-labeling with LLMs, open-source, enterprise option"
  - name: "LMSYS Chatbot Arena / Elo Benchmarks"
    category: "data_eval"
    notes: "Community-driven model evaluation via blind pairwise comparison, gold standard for comparing fine-tuned models"
  - name: "OpenAI Evals / Eval Framework"
    category: "data_eval"
    notes: "Standardized evaluation framework for fine-tuned models, custom eval creation, used with OpenAI fine-tuning API"

  # Business & Strategy
  - name: "Fine-tuning vs RAG Decision Framework"
    category: "strategy"
    notes: "When to fine-tune vs use RAG vs both, decision tree for entrepreneurs, cost/quality/latency tradeoffs"
  - name: "Fine-tuning Cost Economics 2024-2026"
    category: "strategy"
    notes: "GPU costs (H100 $2-3/hr), API pricing trends, LoRA vs FFT cost comparison, total cost of ownership"
  - name: "Enterprise Fine-tuning Patterns"
    category: "strategy"
    notes: "Common deployment patterns, data governance, model lifecycle, multi-LoRA serving, A/B testing fine-tuned models"
  - name: "Open-Weight Fine-tuning Ecosystem"
    category: "strategy"
    notes: "Llama 4, Mistral, Qwen 3, DeepSeek-R1, gpt-oss ecosystem, license comparison, fine-tuning community landscape"
  - name: "Safety Alignment Tax & Guardrail Fragility"
    category: "strategy"
    notes: "Fine-tuning degrades safety alignment (GPT-3.5 jailbroken for $0.20), guardrail fragility, enterprise risk mitigation"

execution:
  batch_size: 3
  items_per_agent: 1
  output_dir: "./results"
