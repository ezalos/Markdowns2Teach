<!-- ABOUTME: Side-by-side comparison gallery for PaperBanana diagram outputs. -->
<!-- ABOUTME: Shows OSS (llmsresearch) vs Original (dwzhu-pku) for 10 multi-query methods. -->
<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>PaperBanana Comparison — Multi-Query Embedding Methods</title>
<style>
  * { margin: 0; padding: 0; box-sizing: border-box; }
  body { font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif; background: #f5f5f5; color: #333; padding: 2rem; }
  h1 { text-align: center; margin-bottom: 0.5rem; font-size: 1.8rem; }
  .subtitle { text-align: center; color: #666; margin-bottom: 2rem; font-size: 0.95rem; }
  .method { background: white; border-radius: 12px; box-shadow: 0 2px 8px rgba(0,0,0,0.1); margin-bottom: 2rem; overflow: hidden; }
  .method-header { background: #1a365d; color: white; padding: 1rem 1.5rem; }
  .method-header h2 { font-size: 1.2rem; margin-bottom: 0.25rem; }
  .method-header p { font-size: 0.85rem; opacity: 0.85; }
  .comparison { display: grid; grid-template-columns: 1fr 1fr; gap: 0; }
  .version { padding: 1rem; text-align: center; }
  .version:first-child { border-right: 1px solid #e2e8f0; }
  .version h3 { font-size: 0.9rem; color: #666; margin-bottom: 0.75rem; text-transform: uppercase; letter-spacing: 0.05em; }
  .version img { max-width: 100%; height: auto; border-radius: 8px; border: 1px solid #e2e8f0; cursor: pointer; transition: transform 0.2s; }
  .version img:hover { transform: scale(1.02); }
  .version .missing { display: flex; align-items: center; justify-content: center; min-height: 300px; background: #f8f9fa; border-radius: 8px; border: 2px dashed #cbd5e0; color: #a0aec0; font-size: 0.9rem; }
  .caption { padding: 0.75rem 1.5rem; background: #f8f9fa; border-top: 1px solid #e2e8f0; font-size: 0.85rem; color: #555; font-style: italic; }
  footer { text-align: center; margin-top: 2rem; color: #999; font-size: 0.8rem; }
  /* Lightbox */
  .lightbox { display: none; position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0,0,0,0.9); z-index: 1000; cursor: pointer; }
  .lightbox img { position: absolute; top: 50%; left: 50%; transform: translate(-50%, -50%); max-width: 95%; max-height: 95%; }
  .lightbox.active { display: flex; }
</style>
</head>
<body>

<h1>PaperBanana Diagram Comparison</h1>
<p class="subtitle">Multi-Query Embedding Search Methods — OSS (llmsresearch/paperbanana) vs Original (dwzhu-pku/PaperBanana)</p>

<div id="gallery"></div>

<div class="lightbox" id="lightbox" onclick="this.classList.remove('active')">
  <img id="lightbox-img" src="" alt="Enlarged diagram">
</div>

<footer>
  Generated with PaperBanana · Gemini 2.0 Flash (VLM) + Gemini 3 Pro Image Preview (Image Gen)
</footer>

<script>
const methods = [
  { id: "01-rocchio", title: "Rocchio Relevance Feedback", caption: "Centroid-based query modification using weighted positive/negative examples" },
  { id: "02-linear-svm", title: "Linear SVM on Frozen Embeddings", caption: "Maximum-margin hyperplane boundary for discriminative search" },
  { id: "03-alpha-qe", title: "Alpha-Query Expansion (αQE)", caption: "Similarity-weighted pseudo-relevance feedback with self-attenuating neighbors" },
  { id: "04-qdrant-best-score", title: "Qdrant best_score", caption: "Per-example scoring against all positives/negatives, avoiding centroid collapse" },
  { id: "05-rrf", title: "Reciprocal Rank Fusion (RRF)", caption: "Rank-based fusion of SigLIP2 + DINOv3 without score normalization" },
  { id: "06-tip-adapter", title: "Tip-Adapter", caption: "Training-free cache-based few-shot classification combining CLIP + labeled cache" },
  { id: "07-liteembed", title: "LiteEmbed", caption: "PCA-based embedding optimization for rare classes via dual-loss optimization" },
  { id: "08-lattqe", title: "LAttQE", caption: "Learned self-attention query expansion with non-monotonic weighting" },
  { id: "09-deep-sets", title: "Deep Sets", caption: "Theoretical foundation: φ → Σ → ρ permutation-invariant decomposition" },
  { id: "10-active-learning", title: "Active Learning for Rare Class Discovery", caption: "Human-in-the-loop iterative workflow with uncertainty sampling" }
];

const gallery = document.getElementById('gallery');

methods.forEach(m => {
  const ossPath = `outputs-oss/${m.id}.png`;
  const origPath = `outputs-orig/${m.id}.png`;

  gallery.innerHTML += `
    <div class="method">
      <div class="method-header">
        <h2>${m.id.split('-')[0]}. ${m.title}</h2>
        <p>${m.caption}</p>
      </div>
      <div class="comparison">
        <div class="version">
          <h3>OSS (llmsresearch)</h3>
          <img src="${ossPath}" alt="${m.title} — OSS" onerror="this.outerHTML='<div class=missing>Not yet generated</div>'" onclick="openLightbox(this.src)">
        </div>
        <div class="version">
          <h3>Original (dwzhu-pku)</h3>
          <img src="${origPath}" alt="${m.title} — Original" onerror="this.outerHTML='<div class=missing>Not yet generated</div>'" onclick="openLightbox(this.src)">
        </div>
      </div>
    </div>
  `;
});

function openLightbox(src) {
  document.getElementById('lightbox-img').src = src;
  document.getElementById('lightbox').classList.add('active');
}
</script>

</body>
</html>
