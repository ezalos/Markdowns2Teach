# ABOUTME: Source of truth for the generated dist/html/index.html — declares deck
# ABOUTME: groups, human labels, talk dates, and display order (newest-first by date).
#
# How it works (see scripts/generate-index.py):
#   - Each group maps to a directory under slides/<id>/.
#   - Groups are sorted by `date` descending (most recent talk first).
#   - A `course` group with `subgroups` is rendered as one super-section whose
#     sub-sections each list the decks in slides/<id>/<subgroup-id>/.
#   - A `talk` group lists the decks directly in slides/<id>/.
#   - `prebuilt_html: <file>` marks a deck rendered outside Marp (e.g. by the
#     frontend-slides skill); the generator links the committed HTML directly.
#   - Decks with no built HTML in dist/html/ are skipped, so partial builds
#     (make html-<name>) still produce a sensible index.
#   - Any slides/ dir not covered here still appears under "Not in manifest"
#     so nothing is silently dropped — add it to this file to curate it.

